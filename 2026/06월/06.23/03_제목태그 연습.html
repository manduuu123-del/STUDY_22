<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>최상단 제목</h1>
    <!-- 페이지의 전체의 주제, 단 한 번만 쓸거야 -->
    <h2>나는야(소주제)</h2>
    <!-- h1의 하위주제 -->
    <h3>퉁퉁이(더 작은 주제)</h3>
    <!-- h2의 하위주제 -->
    <h4>골목대장</h4>
    <h5>이라네</h5>
    <h6>퉁퉁이</h6>
    <!-- 디자인 신경 쓰지말고 순차적으로 한다는 걸 신경 써라 
   하위주제들은 여러개 있어도 됨
   계층적이여야 되므로 h1에서 h4로 바로 넘어가지 않기!
   
   잘못된 예시 1
   <h1> 제목 1 </h1>
   <h1> 제목 1 </h1>

   잘못된 예시 2
   <h1> 제목 1 </h1>
   <h4> 제목 4 </h4>

   가능한 예시 1
   <h1> 제목 1 </h1>
   <h2> 제목 2 </h2>
   <h2> 제목 2 </h2>
   -->
  </body>
</html>
