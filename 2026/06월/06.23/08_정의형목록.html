<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <dl>
      <!-- 정의형 목록 전체를 감싸는 부모 태그 -->

      <dt>사과하다</dt>
      <!-- 우리가 정의할 용어 이름 -->

      <dd>자기의 잘못을 인정하고 용서를 바라는 것이다</dd>
      <!-- 해당 용어에 대한 상세 설명 -->

      <!-- <dl>과 <dt>는 반드시 <dl> 안에 있어야됨. 저게 하나의 구조임. -->
    </dl>
  </body>
</html>
