<!doctype html>
<!-- 
 HTML 태그가 아님~~
 문서 형식 선언임
 규칙 1: HTML 문서의 최상단에 위치
 
 HTML 파서에게 "이 문서는 최신 HTML 표준 스펙을 따르고 있으니, 그에 맞추어 올바르게 파싱(해석)해라"하고 명령하는 것과 똑같은
 
 XHTML : 옛날꺼
 HTML5 : 요즘꺼 ㅋ(옛날꺼 요약본)
 == 제일 최신의 HTML 이다라는 뜻 무조건 제일 위에 잇어야됨
 -->

<html lang="en">
  <!--모든 태그들의 부모임 
html은 모든 태그들을 감싸는 부모 태그임
DOM트리에서 루트 노드가 되는 코드
lang="??"은 문서의 언어를 지정하는 거임 ??을 한국어로 하려면 ko로 해야됨-->
  <head>
    <!-- 검색 엔진 로봇에게 필요한 메타데이터를 전달 
 SEO에 좋음!!-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!--만드는 거 안에 안에 있는 내용들이 있어야 하는 곳 -->
  </body>
</html>
