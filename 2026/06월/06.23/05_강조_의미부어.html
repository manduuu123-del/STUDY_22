x<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <strong> 내용 </strong>
    <!-- strong 태그는 문장 내에서 중요한 부분을 나타낼 때 사용
     strong 사이에 내용을 넣어서 그 부분을 강조하는 것임 
     강조 중 가장 큰 강조
     예) 광고메시지, 주의사항 등-->
    <em> 내용 </em>
    <!-- strong 태그는 특정 단어를 강조할 때 사용
     em 사이에 내용을 넣어서 그 부분을 강조하는 것임 
     예) 기술 용어, 외국어 등
     -->

    <p>예시임1</p>
    <p><strong> 강조 </strong> 및 <em>의미부여</em> 태그를 사용할 거예요.</p>
    <p><strong>주의 : </strong> 프로젝트 마감 기한 반드시 엄수</p>
    <p>이 서비스는 <em> 반응형 앱</em>기술을 사용하여 제작함</p>

    <p>찾으시는 검색어 <mark>HTML</mark>관련 게시글임.</p>
    <!-- 사용자의 검색어와 일치하는 부분을 보여주거나, 주의를 환기해야 하는 특정 단어에 사용-->
    <p><small>본 게시물의 저작권은 UZU Dev에 있음</small></p>
    <!-- ;아ㅓ림ㄴ어ㅏ;-->
    <p>오늘의 할인 가격 : <del>50,000원</del><ins>35,000원</ins></p>
    <!-- ;아ㅓ림ㄴ어ㅏ;-->
  </body>
</html>
