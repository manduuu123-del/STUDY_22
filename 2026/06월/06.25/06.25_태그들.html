<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시맨틱 태그</title>
  </head>
  <body>
    <header>
      <!-- 로고, 사이트명, 검색창, 웹 이동 링크들
     태그는 그저 컨테이너일 뿐 -->
      <h1>사이트 이름</h1>
      <nav>
        <!-- nav 태그는 주요 탐색(우리가 만들어 놓은 탭들) 링크의 묶음
         컨테이너-->
        <nl>
          <!-- 내부들의 묶음
             한 페이지에 여러 번 쓸 수 있다 -->
          <li>HOME<a href="/home">HOME</a></li>
          <li>Project</li>
          <li>Blogs</li>
        </nl>
      </nav>
    </header>

    <main>
      <!-- main 태그는 해당 페이지의 핵심 콘텐츠 영역
       한 문서에 하나만 존재함
       body의 직계자식임.-->
    </main>

    <article>
      <!-- 다른 페이지나 플랫폼에 그대로 배포하거나
   공유해도 의미가 충분히 전달되는 독립적인 콘텐츠 영역
   ex) 네이버 - 안에 있는 기사들, 블로그, 댓글-->
    </article>

    <section>
      <!-- 주제별로 묶이는 구역
     ex) 네이버 안에 있는 기사들 - 주제를 나누는 것(뉴스/엔터/게임/스포츠 같은 종류들, 댓글들의 묶음, 블로그의 묶음) 
     heading tag(h1~h6)이 필요함. section 안에 article과 head 태그들이 들어감.
     근데 article는 없어도 됨 필수는 아님.
     아티클과 세션은 서로 부모와 자식이 될 수 있음.
     그러나 세션은 헤딩 태그를 넣어라.
     아티클에 헤딩태그를 웬만하면 넣어라-->
    </section>

    <div>
      <!-- 디자인 용도
     아무의미는 없지만 디자인 용도임
     얘를 묶은 다음 어쩌고 싶을 때 사용
     div를 남발하는 건 X -->
      <p>하이?</p>
    </div>

    <aside>
      <!-- 사이드바, 참고 정보
     notion 보면 사이드바처럼 옆에 뜨는 거
     주요 콘텐츠랑 연관은 있는데 간접적으로 부가 정보를 알려주는 데이터들을 묶음
      필수적인 콘텐츠에 넣으면 안됨 (h2같은 곳에)
      교과서보면 본문말고 본문 옆에있는 설명하는 것들
      -->
    </aside>

    <footer>
      <!-- 페이지 하단에 있는 정보들
     이 페이지를 누가 만들었는지, 관련 링크들, 이메일, 연락처, 작성자 정보 -->
    </footer>

    <button>이건 버튼 나중에 javascript랑 연결할 거임</button>
  </body>
</html>
