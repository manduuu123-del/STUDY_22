<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 
      [전역 속성(Global Attributes)]
      * id : 식별자(문서 내에 유일해야 함) / 하나의 얘한테만 쓸수 있음 / 무조건 하나의 태그에만 속성 사용 가능
      * class : 식별자(여러 요소에 공통적으로 붙일 수 있음) / 얘는 상관없음
      * lang : 언어 선언
      * title : 마우스 호버 시에 풀팁으로 표시되는 내용 // 더 자세한 설명 할 때 필요
      * hidden : 요소를 화면에 숨길 때 사용 (DOM에만 존재를 함)
      * tabindex : 키보드 탭 순서를 제어함.
      * data-* : 개발자가 정의하는 커스텀 데이터 속성
      * style : 인라인 CSS할 때 사용


      [스크린 리더 관련 속성]
      *aria-current : 현재 어디에 있는가 
      *aria-hidden : 스크린 리더에만 숨기는 거임(온전히 디자인 요소일 때만 사용)
    -->
    <header id="header" class="text" title="하이 ㅋ">
      <p tabindex="0" style="color: aqua">hi</p>
      <p id="p" class="text" tabindex="1">header inside</p>
    </header>

    <!-- radio: 단독 선택 -->
    <form action="">
      <fieldset>
        <legend>성별</legend>

        <label> <input type="radio" name="gender" value="male" /> 남성 </label>
        <label>
          <input type="radio" name="gender" value="female" /> 여성
        </label>
        <label> <input type="radio" name="gender" value="other" /> 기타 </label>
      </fieldset>
    </form>

    <!-- checkbox: 복수 선택 -->
    <form action="">
      <fieldset>
        <legend>성별</legend>

        <label for=""> <input type="checkbox" /> 여성 </label>
        <label for=""> <input type="checkbox" /> 남성 </label>
        <label for=""> <input type="checkbox" /> 기타 </label>
      </fieldset>
    </form>
    <!-- type가 radio면 단독 선택할 때, checkbox면 복수 선택할 때 -->
    <!-- 
      [속성]
      * href : 이동할 url, #id, mailto:, tel: 가능해요
      * target : _self (현재 탭, 기본), _blank (새 탭)
      * rel : 링크 관계. noopener noreferrer (새 탭 보안)
      * download : 클릭 시 다운로드
      * hreflang : 링크 대상 문서의 언어
    -->
    <a
      href="https://ko.dict.naver.com/"
      target="_blank"
      rel="noopener noreferrer"
      >NAVER</a
    >
    <a href="./쿼카.avif" download="쿼카.avif">다운로드</a>
  </body>
</html>
